services:
  - type: web
    name: bro-shop-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: SHOP_CONTACT
        value: trushnyibro
    # Опционально: платный постоянный диск, чтобы товары и загруженные фото
    # не пропадали при рестарте/редеплое (см. README, раздел "Постоянное хранилище").
    # disk:
    #   name: bro-data
    #   mountPath: /opt/render/project/src
    #   sizeGB: 1
